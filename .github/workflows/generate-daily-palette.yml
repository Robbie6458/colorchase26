name: Generate Daily Palette

on:
  schedule:
    # 9 AM Pacific is 16 UTC in summer and 17 UTC in winter.
    # The edge function skips the 8 AM invocation automatically.
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-palette:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl --fail-with-body --retry 3 -X POST \
            https://iczkzoupdzkakgzvwdye.supabase.co/functions/v1/generate-daily-palette \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{}'
